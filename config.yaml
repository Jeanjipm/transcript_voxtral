# Configuration par défaut Voxtral Dictée
# Ce fichier est copié dans ~/.voxtral/config.yaml au premier lancement.
# Toute modification depuis l'UI Préférences est sauvegardée là-bas,
# pas ici.

model:
  # Modèle de transcription par défaut (3.2 Go, qualité/vitesse optimal).
  # Alternatives :
  #   mzbac/voxtral-mini-3b-8bit       (5.3 Go, qualité supérieure)
  #   mistralai/Voxtral-Mini-3B-2507   (~8 Go, full précision)
  #   mlx-community/whisper-large-v3-mlx    (libre de droits MIT, transcription + traduction)
  name: "mzbac/voxtral-mini-3b-4bit-mixed"
  path: "~/.voxtral/models/"

hotkey:
  # "alt_r" = touche Option DROITE. Mode push-to-talk : maintenir pour
  # enregistrer, relâcher pour transcrire.
  # Alternatives possibles dans l'UI : "alt+space", "cmd+shift+h"…
  combo: "alt_r"

transcription:
  # Langue : "auto" pour détection automatique, ou code ISO-639 :
  # fr, en, de, es, it, pt, nl, hi, ...
  language: "auto"
  # "transcribe" : audio → texte dans la langue parlée
  # "translate"  : audio → texte traduit en anglais
  task: "transcribe"
  max_new_tokens: 1024

sounds:
  enabled: true
  volume: 0.5  # 0.0 à 1.0 — sons système macOS (Tink/Pop)

ui:
  # Si true : copie + colle automatiquement. Si false : copie uniquement.
  auto_paste: true

updates:
  # Si true (défaut) : check silencieux au démarrage de l'app pour
  # détecter une nouvelle version sur GitHub. Si MAJ dispo, le menu
  # affiche "Mises à jour disponibles…". L'utilisateur peut aussi
  # forcer un check via ce même menu.
  # Mettre à false si tu ne veux aucun appel réseau (mode 100% offline).
  auto_check: true

recording:
  # Coupe-circuit anti-blocage : si le relâchement du raccourci n'est jamais
  # reçu (macOS désactive parfois la surveillance clavier), l'enregistrement
  # s'arrête tout seul au bout de ce délai, en secondes. L'audio est conservé
  # dans ~/.voxtral/recordings/ et n'est pas collé — tu peux le transcrire
  # ensuite via « Transcrire un fichier audio… ».
  max_duration_s: 300
  # Nombre de tentatives de reconstruction du micro s'il refuse de démarrer
  # (casque branché ou débranché, Bluetooth, dock, sortie de veille).
  start_retries: 1
  # On continue d'enregistrer ce délai (en millisecondes) APRÈS que tu as
  # relâché le raccourci. Sans ça la fin de phrase est coupée : on lâche la
  # touche en finissant de prononcer le dernier mot. Augmente si tes fins de
  # phrase sont encore rognées ; diminue si tu trouves la dictée trop lente.
  tail_padding_ms: 350
  # Silence ajouté de chaque côté de l'enregistrement avant transcription.
  # Les modèles se comportent mal quand la parole démarre ou finit pile au
  # bord du fichier — le premier ou le dernier mot y perd des sons.
  silence_padding_ms: 250

file_transcription:
  # Transcription d'un fichier audio déjà enregistré, via
  # « Transcrire un fichier audio… » dans le menu.
  #
  # Modèle dédié aux fichiers. Whisper est choisi parce qu'il fournit des
  # HORODATAGES, ce que Voxtral ne sait pas faire — sans eux, pas de repères
  # dans le .txt ni d'identification des locuteurs.
  # Turbo mesuré à 64x le temps réel contre 17x pour large-v3, avec une
  # fidélité légèrement meilleure sur du français. Bascule automatiquement sur
  # large-v3 si tu demandes la traduction, que turbo ne sait pas faire.
  model: "mlx-community/whisper-large-v3-turbo"
  # Dossier où sont écrits les .txt.
  output_dir: "~/Documents/Voxtral"
  # Durée d'un bloc traité d'un coup, en secondes. Volontairement large :
  # à l'intérieur d'un bloc, Whisper applique son propre découpage, plus fiable
  # que le nôtre. C'est aussi le délai maximum qu'une dictée peut attendre
  # pendant qu'un fichier est en cours de transcription.
  block_duration_s: 300
  # Fichiers plus longs que ça : refusés (4 h). Garde-fou contre un mauvais
  # fichier choisi par erreur.
  max_duration_s: 14400
  # Préfixer chaque paragraphe par [hh:mm:ss] dans le .txt.
  include_timestamps: true
  # Identifier les locuteurs (« Locuteur 1 », « Locuteur 2 »…).
  #
  # ⚠️ EXPÉRIMENTAL ET ACTUELLEMENT PEU FIABLE. Le modèle disponible sur MLX
  # ne sépare que des voix très différentes (mesuré : au-delà d'environ 40 %
  # d'écart de hauteur, soit près d'une octave). Une voix masculine et une voix
  # féminine ne sont pas distinguées. Laisse à false jusqu'à ce qu'un moteur
  # plus fiable soit intégré — cf. l'en-tête de diarizer.py pour les mesures.
  diarization: false

offline:
  # Si true (défaut) : quand le modèle est déjà téléchargé, plus aucun
  # accès réseau au chargement. Corrige le cas « pas de Wi-Fi » ou
  # « Mac qui sort de veille », où charger un modèle pourtant présent sur
  # le disque échouait après plusieurs secondes de tentatives.
  # Le téléchargement d'un nouveau modèle reste évidemment autorisé.
  prefer_offline: true
