# Configuration par défaut Voxtral Dictée
# Ce fichier est copié dans ~/.voxtral/config.yaml au premier lancement.
# Toute modification depuis l'UI Préférences est sauvegardée là-bas,
# pas ici.

model:
  # Modèle de transcription par défaut (3.2 Go, qualité/vitesse optimal).
  # Alternatives :
  #   mzbac/voxtral-mini-3b-8bit       (5.3 Go, qualité supérieure)
  #   mistralai/Voxtral-Mini-3B-2507   (~8 Go, full précision)
  #   mlx-community/whisper-large-v3-mlx    (libre de droits MIT, transcription + traduction)
  name: "mzbac/voxtral-mini-3b-4bit-mixed"

hotkey:
  # "alt_r" = touche Option DROITE. Mode push-to-talk : maintenir pour
  # enregistrer, relâcher pour transcrire.
  # Le plus simple est de l'enregistrer dans Préférences → Dictée →
  # « Modifier… » : on appuie sur les touches voulues, et c'est écrit ici.
  # À la main, aussi possible : "f13", "alt+space", "cmd+shift+h"…
  # Sur macOS, "cmd" / "alt" / "ctrl" / "shift" désignent la touche de
  # GAUCHE ; celles de droite s'écrivent "cmd_r", "alt_r", etc.
  combo: "alt_r"

transcription:
  # Langue : "auto" pour détection automatique, ou code ISO-639 :
  # fr, en, de, es, it, pt, nl, hi, ...
  language: "auto"
  # "transcribe" : audio → texte dans la langue parlée
  # "translate"  : audio → texte traduit en anglais
  task: "transcribe"
  # Longueur minimale garantie du texte produit, en jetons (≈ 5 minutes de
  # parole). Pour une dictée plus longue, la limite est relevée toute seule
  # en fonction de la durée de l'audio (8 jetons par seconde) : tu n'as pas
  # à y toucher.
  max_new_tokens: 1024

sounds:
  enabled: true
  volume: 0.5  # 0.0 à 1.0 — sons système macOS (Tink/Pop)

ui:
  # Si true : copie + colle automatiquement. Si false : copie uniquement.
  auto_paste: true
  # Après le collage, ce que tu avais copié avant la dictée est remis dans le
  # presse-papier au bout de ce délai (en millisecondes). macOS ne dit pas
  # quand l'application a fini de lire le presse-papier : on ne peut
  # qu'attendre. Si une app lente (bureau distant, Electron, machine
  # virtuelle) colle l'ANCIEN contenu au lieu de ta dictée, monte à 800 ou
  # 1000. Réglable aussi dans Préférences → Avancé.
  clipboard_restore_delay_ms: 300

updates:
  # Si true (défaut) : check silencieux au démarrage de l'app pour
  # détecter une nouvelle version sur GitHub. Si MAJ dispo, le menu
  # affiche "Mises à jour disponibles…". L'utilisateur peut aussi
  # forcer un check via ce même menu.
  # Mettre à false si tu ne veux aucun appel réseau (mode 100% offline).
  auto_check: true

recording:
  # Coupe-circuit anti-blocage : si le relâchement du raccourci n'est jamais
  # reçu (macOS désactive parfois la surveillance clavier), l'enregistrement
  # s'arrête tout seul au bout de ce délai, en secondes. L'audio est conservé
  # dans ~/.voxtral/recordings/ et n'est pas collé — tu peux le transcrire
  # ensuite via « Transcrire un fichier audio… ».
  max_duration_s: 300
  # Nombre de tentatives de reconstruction du micro s'il refuse de démarrer
  # (casque branché ou débranché, Bluetooth, dock, sortie de veille).
  start_retries: 1
  # On continue d'enregistrer ce délai (en millisecondes) APRÈS que tu as
  # relâché le raccourci. Sans ça la fin de phrase est coupée : on lâche la
  # touche en finissant de prononcer le dernier mot. Augmente si tes fins de
  # phrase sont encore rognées ; diminue si tu trouves la dictée trop lente.
  tail_padding_ms: 350
  # Silence ajouté de chaque côté de l'enregistrement avant transcription.
  # Les modèles se comportent mal quand la parole démarre ou finit pile au
  # bord du fichier — le premier ou le dernier mot y perd des sons.
  silence_padding_ms: 250
  # Filtre anti-silence. Si le moment le plus fort de l'enregistrement reste
  # sous ce niveau (en dBFS : 0 = saturation, -45 = très faible), rien n'est
  # envoyé au modèle — sinon il invente une phrase (« Merci. »,
  # « Sous-titres… ») qui serait collée telle quelle. Repères : pièce calme
  # entre -70 et -50, voix normale entre -30 et -15. Si de vraies dictées sont
  # ignorées (voix très douce, micro lointain), baisse à -55. Mets -120 pour
  # désactiver le filtre. Le journal indique chaque dictée jetée.
  silence_threshold_dbfs: -45
  # Contrôle « dictée trouée ». Un micro mal branché (carte son USB qui
  # décroche, hub capricieux) peut ne rendre qu'une partie du son. Si moins
  # de cette part du son attendu a été captée (0.7 = 70 %), la dictée n'est
  # pas collée — le texte serait amputé sans que tu le saches. Elle est
  # gardée dans ~/.voxtral/recordings/, une alerte s'affiche dans le menu, et
  # la liaison avec le micro est reconstruite. Ne concerne que les dictées de
  # 2 secondes et plus. Mets 0 pour désactiver.
  min_capture_ratio: 0.7
  # Détection de la parole. Avant de transcrire, un petit modèle (Silero VAD,
  # 2 Mo, téléchargé tout seul au premier lancement) vérifie qu'il y a bien
  # une voix dans l'enregistrement. Plus juste que le seuil de volume
  # ci-dessus : il ne prend pas un bruit pour de la parole, et il ne jette
  # pas une phrase chuchotée. Tant que le modèle n'est pas là, le seuil de
  # volume fait le travail comme avant. Mets false pour revenir au seuil seul.
  speech_detection: true

file_transcription:
  # Transcription d'un fichier audio déjà enregistré, via
  # « Transcrire un fichier audio… » dans le menu.
  #
  # Modèle dédié aux fichiers. Whisper est choisi parce qu'il fournit des
  # HORODATAGES, ce que Voxtral ne sait pas faire — sans eux, pas de repères
  # dans le .txt ni d'identification des locuteurs.
  # Turbo mesuré à 64x le temps réel contre 17x pour large-v3, avec une
  # fidélité légèrement meilleure sur du français. Bascule automatiquement sur
  # large-v3 si tu demandes la traduction, que turbo ne sait pas faire.
  model: "mlx-community/whisper-large-v3-turbo"
  # Dossier où sont écrits les .txt.
  output_dir: "~/Documents/Voxtral"
  # Durée d'un bloc traité d'un coup, en secondes. Volontairement large :
  # à l'intérieur d'un bloc, Whisper applique son propre découpage, plus fiable
  # que le nôtre. C'est aussi le délai maximum qu'une dictée peut attendre
  # pendant qu'un fichier est en cours de transcription.
  block_duration_s: 300
  # Fichiers plus longs que ça : refusés (4 h). Garde-fou contre un mauvais
  # fichier choisi par erreur.
  max_duration_s: 14400
  # Préfixer chaque paragraphe par [hh:mm:ss] dans le .txt.
  include_timestamps: true
  # Identifier les locuteurs (« Locuteur 1 », « Locuteur 2 »…).
  #
  # Utilise Sortformer v2.1 (225 Mo, téléchargé au premier usage), qui a
  # remplacé la v1 : mesuré à 96 % d'attribution correcte sur un dialogue à
  # deux voix, contre 50-56 % pour la v1. Jusqu'à 4 personnes.
  # Réglable aussi dans Préférences → Fichiers. Détail des mesures dans
  # l'en-tête de diarizer.py.
  diarization: false

offline:
  # Si true (défaut) : quand le modèle est déjà téléchargé, plus aucun
  # accès réseau au chargement. Corrige le cas « pas de Wi-Fi » ou
  # « Mac qui sort de veille », où charger un modèle pourtant présent sur
  # le disque échouait après plusieurs secondes de tentatives.
  # Le téléchargement d'un nouveau modèle reste évidemment autorisé.
  prefer_offline: true

maintenance:
  # Entretien automatique au démarrage de l'app.
  # Le journal ~/.voxtral/voxtral.log est tronqué (on garde la fin) dès
  # qu'il dépasse cette taille, en mégaoctets. 0 = jamais.
  log_max_mb: 10
  # Les dictées coupées pour dépassement de durée sont gardées dans
  # ~/.voxtral/recordings/ ; celles plus vieilles que ce nombre de jours sont
  # supprimées. 0 = jamais.
  recordings_max_age_days: 30

synthesis:
  # Lecture à voix haute : menu « Lire le texte copié » (le presse-papier est
  # lu au haut-parleur) et commande vocaliser_cahier.py. Tout se passe sur ton
  # Mac, comme la dictée.
  # Modèle Voxtral 4B TTS en 4 bits (2,5 Go). Il n'est téléchargé qu'à la
  # première lecture, après confirmation — tu n'as rien à faire si tu ne te
  # sers jamais de la lecture.
  model: "mlx-community/Voxtral-4B-TTS-2603-mlx-4bit"
  # La voix. Deux voix françaises : "fr_female" (femme) et "fr_male" (homme).
  # Réglable dans Préférences → Lecture, où les 20 voix du modèle sont
  # listées avec leur langue.
  voice: "fr_female"
  # Les voix lisent mal les chiffres : avant la lecture, les nombres sont
  # écrits en toutes lettres (« 14h30 » → « quatorze heures trente »,
  # « 3500 € » → « trois mille cinq cents euros »). Mets false pour lire le
  # texte tel quel.
  spell_numbers: true
  # Prononciations : pour un mot que la voix écorche, la façon de l'écrire
  # pour qu'il soit bien dit. Se remplit dans Préférences → Lecture. Exemple :
  #   pronunciations:
  #     Kixit: Kiksit
  pronunciations: {}

lexicon:
  # Lexique personnel : les noms propres et sigles que les modèles écorchent.
  # Le plus simple est de le remplir dans Préférences → Mes mots.
  #
  # Corrections automatiques : « ce que le modèle écrit » → « ce que tu
  # veux ». Appliquées après chaque transcription (dictée et fichiers), avec
  # tous les modèles, mot entier et sans tenir compte des majuscules. Exemple :
  #   corrections:
  #     KickSit: Kixit
  #     "la TV a": "la TVA"
  corrections: {}
  # Mots soufflés à Whisper avant la dictée (noms de clients, sigles), pour
  # qu'il les écrive juste du premier coup. Exemple : ["Kixit", "TVA"].
  words: []
  # Active l'envoi de ces mots à Whisper. EXPÉRIMENTAL, donc désactivé par
  # défaut : souffler du texte à Whisper peut lui faire sauter une phrase.
  # Si tes dictées perdent du texte, remets à false. Sans effet avec Voxtral.
  prompt_words: false
