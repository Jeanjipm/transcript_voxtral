# Analyse statique (ruff). Volontairement restreint à ce qui détecte des bugs :
# erreurs de syntaxe, noms non définis, imports inutilisés, pièges courants
# (bugbear), erreurs pylint. Pas de règles de style : le code est déjà
# formaté à la main et une CI qui rougit pour une ligne trop longue n'apprend
# rien à personne.
#
# Lancer en local :  .venv-tests/bin/ruff check .

target-version = "py311"

[lint]
select = ["E9", "F", "B", "PLE"]
