# Intégration continue : lint + tests à chaque push et à chaque PR.
#
# Tourne sur Ubuntu, pas sur macOS : les modules natifs (AppKit, sounddevice,
# mlx, pynput, rumps) sont remplacés par des stubs dans tests/conftest.py,
# donc la suite n'a besoin ni de micro, ni de GPU, ni de permissions macOS.
# Ce qui dépend vraiment du système reste testé à la main (protocole de
# sprint), comme documenté dans tests/README.md.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = version installée par install.sh ; 3.12 = plancher raisonnable.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Dépendances de test
        run: python -m pip install --quiet pytest pytest-mock pyyaml numpy soundfile ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest tests -q
